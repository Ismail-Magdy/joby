name: joby
description: "A professional mobile job app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ==========================================
  # UI & Design
  # ==========================================
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flutter_native_splash: ^2.4.7
  shimmer: ^3.0.0
  flutter_offline: ^6.0.0
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  confetti: ^0.8.0
  lottie: ^3.3.3
  intl_phone_field: ^3.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image_cropper: ^12.2.1
  share_plus: ^10.0.0

  # ==========================================
  # State Management
  # ==========================================
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # ==========================================
  # Dependency Injection
  # ==========================================
  get_it: ^9.2.1

  # ==========================================
  # Backend & Networking
  # ==========================================
  supabase_flutter: ^2.12.0

  # ==========================================
  # Local Storage (Caching)
  # ==========================================
  shared_preferences: ^2.2.2

  # ==========================================
  # Utils & Clean Architecture Helpers
  # ==========================================
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_svg: ^2.2.4
  google_sign_in: ^6.2.1
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  ionicons: ^0.2.2
  dio: ^5.9.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  google_generative_ai: ^0.4.7
  http_parser: ^4.1.2
  url_launcher: ^6.3.0
  http: ^1.2.2
  firebase_core: ^4.7.0

  # ====================================
  # Secure Data
  # ====================================
  flutter_secure_storage: ^9.0.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ==========================================
  # Code Generation Tools
  # ==========================================
  build_runner: ^2.4.8
  freezed: ^2.4.7
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

  # ==========================================
  # App Icon Generator
  # ==========================================
  flutter_launcher_icons: ^0.13.1

# ==========================================
# App Icon Configuration (Must be at Root Level)
# ==========================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon-launcher.png"
  adaptive_icon_background: "#5F33E1"
  adaptive_icon_foreground: "assets/icons/play-store-icon-launcher.png"

flutter:
  uses-material-design: true

  # ==========================================
  # Assets
  # ==========================================
  assets:
    - .env
    - assets/images/
    - assets/svgs/
    - assets/icons/
    - assets/lotties/

  # ==========================================
  # Custom Fonts
  # ==========================================
  fonts:
    - family: BrunoAceSC
      fonts:
        - asset: assets/fonts/BrunoAceSC-Regular.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
