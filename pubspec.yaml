name: joby
description: "A professional mobile job app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ==========================================
  # UI & Design
  # ==========================================
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  flutter_native_splash: ^2.4.7

  # ==========================================
  # State Management
  # ==========================================
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # ==========================================
  # Dependency Injection
  # ==========================================
  get_it: ^9.2.1

  # ==========================================
  # Backend & Networking
  # ==========================================
  supabase_flutter: ^2.12.0

  # ==========================================
  # Local Storage (Caching)
  # ==========================================
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # ==========================================
  # Utils & Clean Architecture Helpers
  # ==========================================
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.2.4
  google_sign_in: ^6.2.1
  file_picker: ^10.3.10
  image_picker: ^1.2.1
  ionicons: ^0.2.2
  dio: ^5.9.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  google_generative_ai: ^0.4.7
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ==========================================
  # Code Generation Tools
  # ==========================================
  build_runner: ^2.4.8
  freezed: ^2.4.7
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

  # ==========================================
  # App Icon Generator
  # ==========================================
  flutter_launcher_icons: ^0.13.1

# ==========================================
# App Icon Configuration (Must be at Root Level)
# ==========================================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon-launcher.png"
  adaptive_icon_background: "#5F33E1"
  adaptive_icon_foreground: "assets/icons/play-store-icon-launcher.png"

flutter:
  uses-material-design: true

  # ==========================================
  # Assets
  # ==========================================
  assets:
    - assets/images/
    - assets/svgs/
    - assets/icons/

  # ==========================================
  # Custom Fonts
  # ==========================================
  fonts:
    - family: BrunoAceSC
      fonts:
        - asset: assets/fonts/BrunoAceSC-Regular.ttf

    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Italic-VariableFont_wght.ttf
        - asset: assets/fonts/Jost-VariableFont_wght.ttf
